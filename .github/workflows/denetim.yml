# Her gönderimde testler, veri denetimi ve tarayıcıda site denetimi çalışır.
# Sonuç GitHub'da commit'in yanında yeşil tik ya da kırmızı çarpı olarak görünür.
name: Denetim
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testler:
    name: Testler ve veri denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Birim testleri
        run: node --test "araclar/test/*.test.js"
      - name: Veri denetimi
        run: node araclar/dogrula.js
  site:
    name: Tarayıcıda site denetimi
    runs-on: ubuntu-latest
    needs: testler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright ve Chromium
        run: |
          npm install -g playwright@1.56.1
          npx -y playwright@1.56.1 install --with-deps chromium
      - name: Site denetimi
        run: NODE_PATH=$(npm root -g) node araclar/denetim/site.js
